default:
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - runner_unsupported
      - unknown_failure

variables:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  GIT_DEPTH: 1

stages:
  - build
  - integration_testing
  - deploy

include:
  - local: scripts/ci-cd/.rust_template.yml

  - local: scripts/ci-cd/.canister_tests.yml

build:
  stage: build
  extends: .rust template
  variables:
    KUBERNETES_MEMORY_LIMIT: "6Gi"
    KUBERNETES_MEMORY_REQUEST: "4Gi"
    KUBERNETES_CPU_LIMIT: "4"
    KUBERNETES_CPU_REQUEST: "2"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "Cargo.{lock,toml}"
        - "{src,integrations_tests}/**/*.{rs,toml,lock}"
    - if: $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_REF_NAME == "master"
  script:
    - wget -q -O pocket-ic.gz https://github.com/dfinity/pocketic/releases/download/9.0.1/pocket-ic-x86_64-linux.gz
    - gzip -d pocket-ic.gz
    - chmod +x ./pocket-ic
    - mv ./pocket-ic ./integrations_tests/pocket-ic
    - bash ./scripts/build.sh
  artifacts:
    paths:
      - src/core_nft/wasm/
      - src/index_icrc7/wasm/
      - integrations_tests/wasm/
      - integrations_tests/pocket-ic
    expire_in: 1 day

rust lint:
  stage: build
  extends: .rust template
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "Cargo.{lock,toml}"
        - "{src,integrations_tests}/**/*.{rs,toml,lock}"
    - if: $CI_OPEN_MERGE_REQUESTS
      when: never
      changes:
        - "Cargo.{lock,toml}"
        - "{src,integrations_tests}/**/*.{rs,toml,lock}"
    - if: $CI_COMMIT_REF_NAME == "master"
      changes:
        - "Cargo.{lock,toml}"
        - "{src,integrations_tests}/**/*.{rs,toml,lock}"
  script:
    - cargo clippy

deploy:
  stage: deploy
  extends: .rust template
  needs: ["build"]
  rules:
    - if: $CI_COMMIT_REF_NAME == "master"
  script:
    - |
      RELEASE_TAG="v$(date +'%Y.%m.%d')-$(echo $CI_COMMIT_SHA | cut -c1-7)"
      RELEASE_RESPONSE=$(curl -s -X POST \
        -H "Authorization: token $GITHUB_TOKEN" \
        -H "Accept: application/vnd.github.v3+json" \
        "https://api.github.com/repos/$GITHUB_REPO/releases" \
        -d "{
          \"tag_name\": \"$RELEASE_TAG\",
          \"name\": \"Release $RELEASE_TAG\",
          \"body\": \"Automated release from GitLab CI\",
          \"draft\": false,
          \"prerelease\": false
        }")
      UPLOAD_URL=$(echo $RELEASE_RESPONSE | jq -r '.upload_url' | sed 's/{?name,label}//')
      for CANISTER in core_nft index_icrc7; do
        curl -s -X POST \
          -H "Authorization: token $GITHUB_TOKEN" \
          -H "Content-Type: application/octet-stream" \
          --data-binary @"src/${CANISTER}/wasm/${CANISTER}_canister.wasm.gz" \
          "$UPLOAD_URL?name=${CANISTER}_canister.wasm.gz"
        curl -s -X POST \
          -H "Authorization: token $GITHUB_TOKEN" \
          -H "Content-Type: application/octet-stream" \
          --data-binary @"src/${CANISTER}/wasm/can.did" \
          "$UPLOAD_URL?name=${CANISTER}.did"
      done
  variables:
    GITHUB_TOKEN: ${GITHUB_TOKEN}
    GITHUB_REPO: ${GITHUB_REPO}
